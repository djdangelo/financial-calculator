<div>
  <app-wizard-stepper [current]="step()" [completed]="completed()" />

  <div [class]="layoutClass()">
    <section class="flex min-w-0 flex-col gap-6">
      <header class="flex flex-col gap-2">
        <h1 class="text-2xl font-extrabold tracking-tight text-surface-900 dark:text-surface-0 sm:text-3xl">
          {{ title() }}
        </h1>
        <p class="text-surface-600 dark:text-surface-300">{{ description() }}</p>
      </header>

      <div class="flex flex-col gap-4">
        <ng-content />
      </div>

      @if (showIncomplete()) {
      <p-message severity="error" [text]="incompleteMessage()" />
      }

      <app-wizard-navigation [previousRoute]="previousRoute()" [hasNext]="hasNext()" (next)="continue()" />
    </section>

    <ng-content select="[wizardAside]" />
  </div>
</div>
