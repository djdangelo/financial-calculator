<div *transloco="let t; read: 'shared.wizard'" class="flex items-center justify-between gap-3">
  <p-button [routerLink]="backRoute()" [label]="t('back')" icon="pi pi-arrow-left" severity="secondary"
    [outlined]="true" />

  @if (hasNext()) {
  <p-button [label]="t('next')" icon="pi pi-arrow-right" iconPos="right" (onClick)="next.emit()" />
  }
</div>
