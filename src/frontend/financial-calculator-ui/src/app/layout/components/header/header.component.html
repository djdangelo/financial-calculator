<header *transloco="let t; read: 'app'"
  class="sticky top-0 z-20 border-b border-surface-200 bg-surface-0/80 backdrop-blur-md transition-colors duration-300 dark:border-surface-800 dark:bg-surface-950/80">
  <div class="mx-auto flex h-16 max-w-5xl items-center justify-between gap-3 px-4 sm:px-6">
    <a routerLink="/" class="flex min-w-0 items-center gap-3">
      <span
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-primary text-primary-contrast shadow-sm">
        <i class="pi pi-calculator" aria-hidden="true"></i>
      </span>
      <span class="text-sm font-bold leading-tight tracking-tight text-surface-900 dark:text-surface-0 sm:text-base">
        {{ t('name') }}
      </span>
    </a>

    <div class="flex shrink-0 items-center gap-2">
      <app-language-switcher />
      <app-theme-toggle />
    </div>
  </div>
</header>
