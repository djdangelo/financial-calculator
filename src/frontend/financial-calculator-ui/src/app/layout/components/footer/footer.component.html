<footer *transloco="let t; read: 'layout.footer'"
  class="border-t border-surface-200 transition-colors duration-300 dark:border-surface-800">
  <div class="mx-auto flex max-w-5xl flex-col gap-3 px-4 py-6 text-sm sm:px-6">
    <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between sm:gap-6">
      <p class="flex items-start gap-2 font-medium text-surface-700 dark:text-surface-200">
        <i class="pi pi-lock mt-0.5 text-primary-600 dark:text-primary-400" aria-hidden="true"></i>
        <span>{{ t('privacy') }}</span>
      </p>
      <app-clear-data-button class="-ml-2 shrink-0 sm:ml-0 print:hidden" />
    </div>
    <p class="text-surface-500 dark:text-surface-400">{{ t('disclaimer') }}</p>
  </div>
</footer>
