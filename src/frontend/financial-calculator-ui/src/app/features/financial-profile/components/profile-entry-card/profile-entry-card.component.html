<article *transloco="let t; read: 'financial_profile.entry'"
  class="rounded-2xl border border-surface-200 bg-surface-0 p-4 transition-colors duration-300 dark:border-surface-800 dark:bg-surface-900 sm:p-5">
  <header class="mb-4 flex items-center justify-between gap-3">
    <div class="flex min-w-0 items-center gap-3">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-primary-50 text-primary-700 dark:bg-primary-950 dark:text-primary-300">
        <i [class]="icon()" aria-hidden="true"></i>
      </span>
      <h2 class="truncate text-base font-bold text-surface-900 dark:text-surface-0">{{ title() }}</h2>
    </div>

    <p-button icon="pi pi-trash" severity="danger" [text]="true" [rounded]="true"
      [ariaLabel]="t('remove', { name: title() })" (onClick)="removed.emit()" />
  </header>

  <div class="grid gap-4 sm:grid-cols-2">
    <ng-content />
  </div>
</article>
