<div *transloco="let t"
  class="rounded-2xl border border-dashed border-surface-300 p-4 transition-colors duration-300 dark:border-surface-700 sm:p-5">
  <p class="text-sm font-bold text-surface-800 dark:text-surface-100">{{ title() }}</p>

  <div class="mt-3 flex flex-wrap gap-2">
    @for (option of options(); track option.value) {
    <button type="button" (click)="selected.emit(option.value)"
      class="flex items-center gap-2 rounded-full border border-surface-200 bg-surface-0 px-3.5 py-2 text-sm font-semibold text-surface-700 outline-none transition-colors hover:border-primary hover:text-primary-700 focus-visible:ring-2 focus-visible:ring-primary dark:border-surface-700 dark:bg-surface-900 dark:text-surface-200 dark:hover:border-primary dark:hover:text-primary-300">
      <i [class]="option.icon" aria-hidden="true"></i>
      {{ t(labelKey() + '.' + option.value) }}
    </button>
    }
  </div>
</div>
