<ng-container *transloco="let t; read: 'financial_profile'">
  @let category = expense().category;
  @let id = fieldId();

  <app-profile-entry-card [icon]="icon()" [title]="t('expenses.categories.' + category)" (removed)="removed.emit()">
    <app-form-field [label]="t('fields.description')" [inputId]="id + '-description'" [optional]="true">
      <input pInputText type="text" [id]="id + '-description'" [formControl]="form.controls.description"
        [placeholder]="t('expenses.placeholder.' + category)" [attr.maxlength]="descriptionMaxLength"
        [fluid]="true" />
    </app-form-field>

    <app-form-field [label]="t('fields.currency')" [labelId]="id + '-currency'">
      <app-currency-toggle [value]="expense().currency" [labelledBy]="id + '-currency'"
        (valueChange)="form.controls.currency.setValue($event)" />
    </app-form-field>

    <app-money-input [control]="form.controls.monthlyAmount" [currency]="expense().currency"
      [inputId]="id + '-amount'" [label]="t('expenses.amount')" [hint]="t('expenses.hint.' + category)"
      [showErrors]="showErrors()" />
  </app-profile-entry-card>
</ng-container>
