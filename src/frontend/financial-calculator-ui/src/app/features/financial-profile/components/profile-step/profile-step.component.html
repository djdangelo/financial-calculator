<app-wizard-step-frame *transloco="let t; read: 'financial_profile.steps'" [step]="step()"
  [completed]="facade.completedSteps()" [complete]="complete()" [title]="t(step() + '.title')"
  [description]="t(step() + '.description')" [incompleteMessage]="t(step() + '.incomplete')"
  [(attempted)]="attempted">
  <ng-content />

  <app-profile-summary wizardAside class="block lg:sticky lg:top-24" />
</app-wizard-step-frame>
