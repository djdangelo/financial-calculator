<div *transloco="let t; read: 'financial_profile.steps'">
  <app-wizard-stepper [current]="step()" [completed]="facade.completedSteps()" />

  <div class="mt-8 grid gap-8 lg:grid-cols-[minmax(0,1fr)_20rem] lg:items-start">
    <section class="flex min-w-0 flex-col gap-6">
      <header class="flex flex-col gap-2">
        <h1 class="text-2xl font-extrabold tracking-tight text-surface-900 dark:text-surface-0 sm:text-3xl">
          {{ t(step() + '.title') }}
        </h1>
        <p class="text-surface-600 dark:text-surface-300">{{ t(step() + '.description') }}</p>
      </header>

      <div class="flex flex-col gap-4">
        <ng-content />
      </div>

      @if (showIncomplete()) {
      <p-message severity="error" [text]="t(step() + '.incomplete')" />
      }

      <app-wizard-navigation [previousRoute]="previousRoute()" [hasNext]="hasNext()" (next)="continue()" />
    </section>

    <app-profile-summary class="block lg:sticky lg:top-24" />
  </div>
</div>
