<details *transloco="let t; read: 'loan_analysis.limits'"
  class="group rounded-xl bg-surface-50 p-3 text-sm dark:bg-surface-950">
  <summary
    class="flex cursor-pointer list-none items-center justify-between gap-2 font-semibold text-surface-800 dark:text-surface-100">
    {{ t('title') }}
    <i class="pi pi-chevron-down text-xs transition-transform group-open:rotate-180" aria-hidden="true"></i>
  </summary>

  <div class="mt-3 flex flex-col gap-3">
    <p class="text-xs text-surface-500 dark:text-surface-400">{{ t('description') }}</p>

    <div class="grid gap-3 sm:grid-cols-2">
      <app-form-field [label]="t('total')" inputId="limit-total">
        <p-inputNumber inputId="limit-total" [suffix]="percentSuffix" [locale]="locale" [min]="minLimit"
          [max]="maxLimit" [useGrouping]="false" [fluid]="true" [ngModel]="limits().totalBurdenPercent"
          (ngModelChange)="settings.setBurdenLimit('totalBurdenPercent', $event)" />
      </app-form-field>

      <app-form-field [label]="t('debt')" inputId="limit-debt">
        <p-inputNumber inputId="limit-debt" [suffix]="percentSuffix" [locale]="locale" [min]="minLimit"
          [max]="maxLimit" [useGrouping]="false" [fluid]="true" [ngModel]="limits().debtBurdenPercent"
          (ngModelChange)="settings.setBurdenLimit('debtBurdenPercent', $event)" />
      </app-form-field>
    </div>

    @if (!settings.usesDefaultBurdenLimits()) {
    <button type="button" (click)="settings.useDefaultBurdenLimits()"
      class="self-start text-xs font-semibold text-primary-700 underline-offset-2 hover:underline dark:text-primary-300">
      {{ t('use_default') }}
    </button>
    }
  </div>
</details>
