<section *transloco="let t; read: 'loan_analysis.verdict'" [class]="cardClass()" aria-live="polite">
  <span [class]="iconClass()">
    <i class="text-2xl" [class]="icon()" aria-hidden="true"></i>
  </span>

  <div class="flex flex-col gap-1.5">
    <p class="text-xs font-bold uppercase tracking-wider text-surface-600 dark:text-surface-300">{{ t('label') }}</p>
    <h2 class="text-xl font-extrabold text-surface-900 dark:text-surface-0 sm:text-2xl">
      {{ t(verdict() + '.title') }}
    </h2>
    <p class="text-surface-700 dark:text-surface-200">
      {{ t(verdict() + '.message', { total: limits().totalBurdenPercent, debt: limits().debtBurdenPercent }) }}
    </p>
  </div>
</section>
