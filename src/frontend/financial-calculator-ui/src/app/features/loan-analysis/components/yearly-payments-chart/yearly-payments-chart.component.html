<section *transloco="let t; read: 'loan_analysis.yearly'"
  class="flex flex-col gap-4 rounded-2xl border border-surface-200 bg-surface-0 p-4 transition-colors duration-300 dark:border-surface-800 dark:bg-surface-900 sm:p-5">
  <header class="flex flex-col gap-1">
    <h2 class="text-base font-bold text-surface-900 dark:text-surface-0">{{ t('title') }}</h2>
    <p class="text-sm text-surface-500 dark:text-surface-400">{{ t('description') }}</p>
  </header>

  <p-chart type="bar" [data]="data()" [options]="options()" [height]="height" [ariaLabel]="t('label')" />
</section>
