<details *transloco="let t; read: 'loan_analysis.help'"
  class="group rounded-2xl border border-surface-200 bg-surface-0 p-4 transition-colors duration-300 dark:border-surface-800 dark:bg-surface-900 sm:p-5">
  <summary
    class="flex cursor-pointer list-none items-center justify-between gap-3 rounded text-base font-bold text-surface-900 outline-none focus-visible:ring-2 focus-visible:ring-primary dark:text-surface-0">
    <span class="flex items-center gap-2">
      <i class="pi pi-question-circle text-primary-600 dark:text-primary-300" aria-hidden="true"></i>
      {{ t('title') }}
    </span>
    <i class="pi pi-chevron-down text-xs transition-transform group-open:rotate-180" aria-hidden="true"></i>
  </summary>

  <dl class="mt-4 grid gap-4 sm:grid-cols-2">
    @for (term of terms; track term.key) {
    <div class="flex gap-3">
      <span
        class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-primary-50 text-primary-700 dark:bg-primary-950 dark:text-primary-200">
        <i [class]="term.icon" aria-hidden="true"></i>
      </span>
      <div class="flex flex-col gap-1">
        <dt class="text-sm font-semibold text-surface-900 dark:text-surface-0">{{ t('terms.' + term.key + '.title') }}</dt>
        <dd class="text-sm text-surface-600 dark:text-surface-300">{{ t('terms.' + term.key + '.text', { total: limits().totalBurdenPercent, debt: limits().debtBurdenPercent }) }}</dd>
      </div>
    </div>
    }
  </dl>
</details>
